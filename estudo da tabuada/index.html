<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1014">
<title>Tabuada Rápida — treino com cronômetro</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="app">
  <h1>Tabuada Rápida ⏱️</h1>
  <p class="sub">Questões aleatórias, cronômetro por questão e registro completo de tempos.</p>

  <!-- ============ CONFIGURAÇÃO ============ -->
  <section id="setup" class="card">
    <h2>1. Escolha as tabuadas</h2>
    <div id="tables" class="chips"></div>

    <div class="row">
      <button class="btn" data-preset="all">Todas (1–10)</button>
      <button class="btn" data-preset="none">Limpar</button>
      <span class="grow"></span>
      <label class="opt">Multiplicador até
        <input type="number" id="maxB" value="10" min="1" max="12">
      </label>
    </div>

    <div class="row">
      <label class="opt">Meta por questão (s)
        <input type="text" id="goalTime" inputmode="decimal" value="5" placeholder="0 = sem meta">
      </label>
    </div>

    <button id="startBtn" class="btn primary btn-block btn-lg">Começar treino</button>
    <button id="reportBtn" class="btn btn-block">📊 Relatório de erros</button>
    <button id="clearAllBtn" class="btn btn-block btn-danger">🗑️ Limpar todos os dados salvos</button>

    <div id="history"></div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="quiz" class="card" style="display:none">
    <div class="topbar">
      <span id="progress">0 / 0</span>
      <span id="timer">0,0s</span>
      <button id="quitBtn" class="btn ghost">Encerrar</button>
    </div>
    <div class="progressbar"><div id="progressFill"></div></div>

    <div class="question" id="question">— <span class="x">×</span> —</div>

    <form id="answerForm" autocomplete="off">
      <input id="answer" type="text" inputmode="numeric" placeholder="?" autocomplete="off" autocorrect="off" spellcheck="false">
      <div class="row row-tight row-center">
        <button type="submit" class="btn primary btn-submit">Responder</button>
        <button type="button" id="skipBtn" class="btn">Pular</button>
      </div>
    </form>

    <div id="feedback" class="feedback"></div>
    <div id="liveStats" class="stats"></div>
  </section>

  <!-- ============ RESULTADOS ============ -->
  <section id="results" class="card" style="display:none">
    <h2 id="resultsTitle">Resultado da sessão</h2>
    <div class="summary" id="summary"></div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>Conta</th><th>Resposta</th><th>Tempo</th><th>Erros</th></tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
    <div class="row actions-row">
      <button id="againBtn" class="btn primary">Novo treino</button>
      <button id="csvBtn" class="btn">Exportar CSV</button>
      <button id="reportBtn2" class="btn">📊 Relatório de erros</button>
    </div>
  </section>

  <!-- ============ MODAL DE RELATÓRIO ============ -->
  <div id="reportModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="Relatório de erros">
    <div class="modal">
      <div class="modal-head">
        <h2 class="modal-title">📊 Relatório de erros</h2>
        <button id="closeReportBtn" class="btn ghost">Fechar</button>
      </div>
      <div id="reportBody"></div>
      <div class="row actions-row">
        <button id="resetErrorsBtn" class="btn">Limpar dados acumulados</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
